<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lazy Vault: premium clips, backgrounds, overlays and SoundFX for your next edit.">
<title>LAZY VAULT: Your Editing Vault</title>
<style>
:root{--bg:#07070d;--card:rgba(255,255,255,.05);--bd:rgba(255,255,255,.1);--tx:#eceaf7;--mut:#9a98b3;--p:#8b5cf6;--b:#38bdf8;--ok:#34d399;--er:#f87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f4fb;--card:rgba(255,255,255,.75);--bd:rgba(0,0,0,.1);--tx:#14122a;--mut:#5d5b78;color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background-image:radial-gradient(60% 40% at 15% 0,rgba(139,92,246,.22),transparent),radial-gradient(50% 35% at 90% 10%,rgba(56,189,248,.16),transparent);background-attachment:fixed}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;align-items:center;padding:10px 16px;background:var(--card);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:900;letter-spacing:.18em;font-size:18px;background:linear-gradient(90deg,var(--p),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(139,92,246,.6));margin-right:auto}
nav a{padding:6px 12px;border-radius:99px;color:var(--mut);font-size:14px}nav a:hover,nav a.on{color:var(--tx);background:var(--card)}
main{max-width:1100px;margin:0 auto;padding:24px 16px 80px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero{text-align:center;padding:64px 0 40px}
.hero h1{font-size:clamp(36px,8vw,76px);margin:0;letter-spacing:.04em;line-height:1.05;background:linear-gradient(90deg,#c4b5fd,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(139,92,246,.4)}
.hero p{color:var(--mut);max-width:520px;margin:14px auto 24px}
.btn{display:inline-block;border:0;cursor:pointer;padding:10px 20px;border-radius:12px;font-weight:600;background:linear-gradient(90deg,var(--p),var(--b));color:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(139,92,246,.45)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.g{background:var(--card);border:1px solid var(--bd);color:var(--tx)}.btn.sm{padding:6px 12px;font-size:14px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:8px 0 32px}
.glass{background:var(--card);border:1px solid var(--bd);border-radius:16px;backdrop-filter:blur(10px)}
.cat{padding:18px;cursor:pointer;transition:.2s}.cat:hover{border-color:var(--p);transform:translateY(-3px)}.cat small{color:var(--mut)}
h2{margin:24px 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}input[type=search]{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{overflow:hidden;transition:.2s;display:flex;flex-direction:column}.card:hover{transform:translateY(-4px);border-color:var(--p);box-shadow:0 10px 30px rgba(139,92,246,.25)}
.th{height:130px;display:flex;align-items:center;justify-content:center;font-size:40px;position:relative}
.demo{position:absolute;top:8px;left:8px;font-size:11px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:99px;color:#fff}
.cb{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}.cb h3{margin:0;font-size:16px}.mut{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.price{font-weight:800;color:var(--b)}.free{color:var(--ok)}
.empty{text-align:center;padding:60px 16px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:in .2s}
.mb{max-width:480px;width:100%;padding:22px;background:var(--bg);max-height:90vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}.tw{overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stats div{padding:16px}.stats b{display:block;font-size:24px}
.bars{display:flex;gap:10px;align-items:flex-end;height:140px;padding:12px}.bars i{flex:1;background:linear-gradient(var(--b),var(--p));border-radius:6px 6px 0 0;min-height:4px;position:relative}
form.f{display:grid;gap:10px;max-width:520px}label{font-size:13px;color:var(--mut);display:grid;gap:4px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;display:grid;gap:8px}
.t{padding:10px 18px;border-radius:12px;background:var(--bg);border:1px solid var(--bd);animation:in .25s}.t.ok{border-color:var(--ok)}.t.er{border-color:var(--er)}
.note{font-size:13px;color:var(--mut);padding:10px 14px;border-left:3px solid var(--p);margin:12px 0}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav aria-label="Main"><a class="logo" href="#home">LAZY VAULT</a>
<a href="#home" data-r="home">Home</a><a href="#explore" data-r="explore">Explore</a><a href="#library" data-r="library">Library</a><a href="#redeem" data-r="redeem">Redeem</a><a href="#admin" data-r="admin" id="adminLink" hidden>Admin</a>
<button class="btn g sm" id="ownerBtn" aria-pressed="false">Owner mode: off</button></nav>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<footer>LAZY VAULT · Front-end demo · Sample assets only</footer>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS={clips:['Anime Clips','🎬'],backgrounds:['Backgrounds','🌌'],overlays:['Overlays','✨'],soundfx:['SoundFX','🔊']};
const seed={products:[
{id:1,name:'Anime Clip Pack',cat:'clips',desc:'Short cinematic clips ready for editing.',price:49,fmt:'MP4',size:'420 MB',buys:128,tags:['anime','clips'],on:1,g:'#6d28d9,#0ea5e9'},
{id:2,name:'Cyberpunk Overlay Pack',cat:'overlays',desc:'Neon glitch, particles and light leaks.',price:79,fmt:'MOV',size:'610 MB',buys:204,tags:['neon','glitch'],on:1,g:'#be185d,#6d28d9'},
{id:3,name:'Dark Background Pack',cat:'backgrounds',desc:'Moody animated and static dark loops.',price:39,fmt:'MP4',size:'300 MB',buys:96,tags:['dark','loop'],on:1,g:'#111827,#4c1d95'},
{id:4,name:'Anime Impact SoundFX',cat:'soundfx',desc:'Hits, whooshes and impact sounds.',price:59,fmt:'WAV',size:'85 MB',buys:171,tags:['impact','whoosh'],on:1,g:'#0369a1,#7c3aed'},
{id:5,name:'Starter Light Leaks',cat:'overlays',desc:'A free taste of Lazy Vault overlays.',price:0,fmt:'MP4',size:'40 MB',buys:310,tags:['free','light'],on:1,g:'#0f766e,#2563eb'}],
lib:[],orders:[],codes:[{code:'LAZY-DEMO-0000-0001',ids:[1],max:50,uses:0,exp:'',on:1}],used:[]};
let S;try{S=JSON.parse(localStorage.getItem('lv')||'null')}catch(e){}S=S||seed;
const save=()=>{try{localStorage.setItem('lv',JSON.stringify(S))}catch(e){}};
let owner=false,q={s:'',cat:'',pf:'',sort:'new'};
function toast(m,t='ok'){const d=document.createElement('div');d.className='t '+t;d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3200)}
const P=i=>S.products.find(p=>p.id==i);
const pr=p=>p.price?'₹'+p.price:'FREE';
const thumb=p=>`<div class="th" style="background:linear-gradient(135deg,${p.g||'#6d28d9,#0ea5e9'})" role="img" aria-label="${esc(p.name)} thumbnail">${CATS[p.cat]?.[1]||'📦'}${p.demo!==0?'<span class="demo">DEMO</span>':''}</div>`;
function card(p){return `<article class="glass card">${thumb(p)}<div class="cb"><span class="mut">${esc(CATS[p.cat]?.[0]||p.cat)}</span><h3>${esc(p.name)}</h3><p class="mut" style="margin:0">${esc(p.desc)}</p><span class="mut">${esc(p.fmt)} · ${esc(p.size)} · ${p.buys} downloads</span><div class="row"><span class="price ${p.price?'':'free'}">${pr(p)}</span><span><button class="btn g sm" data-v="${p.id}">Preview</button> <button class="btn sm" data-b="${p.id}">${S.lib.includes(p.id)?'Owned':p.price?'Purchase':'Get'}</button></span></div></div></article>`}
const empty=(t,s,l,h)=>`<div class="empty"><h3>${t}</h3><p>${s}</p>${l?`<a class="btn" href="${h}">${l}</a>`:''}</div>`;
const views={
home(){return `<section class="hero"><h1>YOUR EDITING VAULT</h1><p>Premium clips, backgrounds, overlays and SoundFX for your next edit.</p><a class="btn" href="#explore">Explore Assets</a> <a class="btn g" href="#redeem">Redeem Code</a></section>
<div class="cats">${Object.entries(CATS).map(([k,v])=>`<div class="glass cat" tabindex="0" role="link" data-c="${k}"><div style="font-size:28px">${v[1]}</div><b>${v[0]}</b><br><small>${S.products.filter(p=>p.cat==k&&p.on).length} assets</small></div>`).join('')}</div>
<h2>Popular</h2><div class="grid">${[...S.products].filter(p=>p.on).sort((a,b)=>b.buys-a.buys).slice(0,4).map(card).join('')}</div>`},
explore(){return `<h2>Explore</h2><div class="bar"><input type="search" id="qs" placeholder="Search name, category, tags" aria-label="Search" value="${esc(q.s)}"><select id="qc" aria-label="Category"><option value="">All categories</option>${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${q.cat==k?' selected':''}>${v[0]}</option>`).join('')}</select><select id="qp" aria-label="Price"><option value="">Free &amp; paid</option><option value="f"${q.pf=='f'?' selected':''}>Free</option><option value="p"${q.pf=='p'?' selected':''}>Paid</option></select><select id="qo" aria-label="Sort"><option value="new">Newest</option><option value="pop"${q.sort=='pop'?' selected':''}>Popular</option><option value="az"${q.sort=='az'?' selected':''}>A–Z</option></select></div><div id="res"></div>`},
library(){const l=S.lib.map(P).filter(Boolean);return `<h2>My Library</h2>`+(l.length?`<div class="grid">${l.map(p=>`<article class="glass card">${thumb(p)}<div class="cb"><h3>${esc(p.name)}</h3><span class="mut">${esc(p.fmt)} · ${esc(p.size)}</span><div class="row"><span></span><button class="btn sm" data-d="${p.id}">Download</button></div></div></article>`).join('')}</div>`:empty('Your vault is empty.','Explore Lazy Vault and find your next editing asset.','Explore Assets','#explore'))+`<h2>Purchases</h2>`+(S.orders.length?`<div class="tw glass"><table><tr><th>Order</th><th>Asset</th><th>Amount</th><th>Status</th></tr>${S.orders.map(o=>`<tr><td>${esc(o.id)}</td><td>${esc(o.n)}</td><td>${o.a?'₹'+o.a:'FREE'}</td><td>${esc(o.s)}</td></tr>`).join('')}</table></div>`:empty('No purchases yet','Paid and free orders will show here.'))},
redeem(){return `<h2>REDEEM YOUR CODE</h2><form class="f" id="rf"><label>Enter your redeem code<input id="rc" required autocomplete="off" maxlength="40" placeholder="XXXX-XXXX-XXXX-XXXX"></label><button class="btn">Redeem</button></form><p class="note">Demo code to try: LAZY-DEMO-0000-0001</p>`},
admin(){if(!owner)return empty('403','You don’t have permission to access this resource.');
const paid=S.orders.reduce((a,o)=>a+o.a,0),mx=Math.max(1,...S.products.map(p=>p.buys*p.price));
return `<h2>Owner Dashboard</h2><p class="note">Demo only: owner mode here is a toggle. In the real app, access comes from the server-side OWNER role.</p>
<div class="stats"><div class="glass">Products<b>${S.products.length}</b></div><div class="glass">Purchases<b>${S.orders.length}</b></div><div class="glass">Revenue<b>₹${paid}</b></div><div class="glass">Codes<b>${S.codes.length}</b></div></div>
<h2>Revenue by product</h2><div class="glass bars">${S.products.map(p=>`<i style="height:${Math.max(3,p.buys*p.price/mx*100)}%" title="${esc(p.name)}: ₹${p.buys*p.price}"></i>`).join('')}</div>
<h2>Products</h2><div class="tw glass"><table><tr><th>Name</th><th>Price</th><th>Status</th><th></th></tr>${S.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${pr(p)}</td><td>${p.on?'Active':'Disabled'}</td><td><button class="btn g sm" data-t="${p.id}">${p.on?'Disable':'Enable'}</button> <button class="btn g sm" data-x="${p.id}">Delete</button></td></tr>`).join('')}</table></div>
<h2>Add product</h2><form class="f" id="pf"><label>Name<input name="n" required maxlength="80"></label><label>Description<textarea name="d" maxlength="300"></textarea></label><label>Category<select name="c">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></label><label>Price (₹, 0 = free)<input name="p" type="number" min="0" max="100000" value="0"></label><label>Tags (comma separated)<input name="t"></label><button class="btn">Save product</button></form>
<h2>Redeem codes</h2><form class="f" id="cf"><fieldset class="glass" style="border:0;padding:12px"><legend class="mut">Products</legend>${S.products.map(p=>`<label style="display:flex;gap:8px"><input type="checkbox" name="ids" value="${p.id}"> ${esc(p.name)}</label>`).join('')}</fieldset><label>Max uses<input name="m" type="number" min="1" max="100000" value="1"></label><label>Expires (optional)<input name="e" type="date"></label><button class="btn">Generate secure code</button></form>
<div class="tw glass" style="margin-top:12px"><table><tr><th>Code</th><th>Uses</th><th>Expires</th><th>Active</th><th></th></tr>${S.codes.map((c,i)=>`<tr><td>${esc(c.code)}</td><td>${c.uses}/${c.max}</td><td>${esc(c.exp||'Never')}</td><td>${c.on?'Yes':'No'}</td><td><button class="btn g sm" data-cc="${i}">Copy</button> <button class="btn g sm" data-ct="${i}">${c.on?'Deactivate':'Activate'}</button></td></tr>`).join('')}</table></div>`}};
function res(){const t=q.s.toLowerCase();let l=S.products.filter(p=>p.on&&(!q.cat||p.cat==q.cat)&&(!q.pf||(q.pf=='f')==!p.price)&&(!t||[p.name,p.desc,CATS[p.cat]?.[0],...p.tags].join(' ').toLowerCase().includes(t)));
l.sort(q.sort=='pop'?(a,b)=>b.buys-a.buys:q.sort=='az'?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.id-a.id);
$('#res').innerHTML=l.length?`<div class="grid">${l.map(card).join('')}</div>`:empty('No results','Try a different search or filter.')}
function route(){let r=(location.hash||'#home').slice(1);if(!views[r])r='home';$('#app').innerHTML=views[r]();document.querySelectorAll('nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r==r));if(r=='explore')res();$('#adminLink').hidden=!owner}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="glass mb" role="dialog" aria-modal="true">${h}</div>`;m.onclick=e=>{if(e.target==m)m.remove()};document.body.append(m);return m}
function buy(id){const p=P(id);if(S.lib.includes(id))return toast('Already in your library');
const m=modal(`<h3>Checkout</h3><p><b>${esc(p.name)}</b></p><p class="mut">Price ${pr(p)} · Fees ₹0</p><p>Total <span class="price">${pr(p)}</span></p><p class="note">Demo: no real payment. The real app verifies payments on the server with Razorpay.</p><button class="btn" id="pay">${p.price?'Pay Securely':'Get for free'}</button> <button class="btn g" id="cx">Cancel</button>`);
m.querySelector('#cx').onclick=()=>m.remove();
m.querySelector('#pay').onclick=e=>{e.target.disabled=true;e.target.textContent='Processing…';setTimeout(()=>{S.lib.push(id);S.orders.unshift({id:'LV-'+Date.now().toString(36).toUpperCase(),n:p.name,a:p.price,s:'Paid'});p.buys++;save();m.innerHTML=`<div class="glass mb"><h3>Purchase Complete</h3><a class="btn" href="#library">Open My Library</a></div>`.replace(/^<div class="glass mb">|<\/div>$/g,'');m.querySelector('a').onclick=()=>m.remove();route()},900)}}
function gen(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint8Array(16);crypto.getRandomValues(b);const c=[...b].map(x=>A[x%A.length]);return[0,4,8,12].map(i=>c.slice(i,i+4).join('')).join('-')}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-c]');if(!t)return;const d=t.dataset;
if(d.c){q.cat=d.c;location.hash='#explore';route()}
else if(d.b)buy(+d.b);
else if(d.v){const p=P(+d.v),m=modal(`${thumb(p)}<h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><p class="mut">${esc(CATS[p.cat][0])} · ${esc(p.fmt)} · ${esc(p.size)}<br>License: Personal use, redistribution prohibited</p><p class="mut">Tags: ${p.tags.map(esc).join(', ')}</p><span class="price">${pr(p)}</span> <button class="btn" id="mb">Purchase</button> <button class="btn g" id="mx">Close</button>`);m.querySelector('#mx').onclick=()=>m.remove();m.querySelector('#mb').onclick=()=>{m.remove();buy(p.id)}}
else if(d.d){const p=P(+d.d),u=URL.createObjectURL(new Blob([`Lazy Vault demo file for ${p.name}\n`],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download=p.name.replace(/\W+/g,'-')+'-demo.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Download started')}
else if(d.t){const p=P(+d.t);p.on=p.on?0:1;save();route()}
else if(d.x){if(confirm('Delete this product?')){S.products=S.products.filter(p=>p.id!=d.x);save();route()}}
else if(d.cc){navigator.clipboard?.writeText(S.codes[d.cc].code).then(()=>toast('Code copied'),()=>toast('Copy failed','er'))}
else if(d.ct){S.codes[d.ct].on=S.codes[d.ct].on?0:1;save();route()}});
document.addEventListener('input',e=>{if(e.target.id=='qs'){q.s=e.target.value;res()}});
document.addEventListener('change',e=>{const k={qc:'cat',qp:'pf',qo:'sort'}[e.target.id];if(k){q[k]=e.target.value;res()}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=new FormData(f);
if(f.id=='rf'){const c=S.codes.find(x=>x.code==v.get('rc').trim().toUpperCase());
if(!c||!c.on||(c.exp&&new Date(c.exp)<new Date())||c.uses>=c.max||S.used.includes(c.code))return toast('This redeem code is invalid or expired.','er');
c.ids.forEach(i=>{if(!S.lib.includes(i)){S.lib.push(i);S.orders.unshift({id:'RD-'+c.code.slice(-4),n:P(i)?.name||'Asset',a:0,s:'Redeemed'})}});c.uses++;S.used.push(c.code);save();toast('Code redeemed. Added to your library.');location.hash='#library'}
else if(f.id=='pf'){S.products.unshift({id:Date.now(),name:v.get('n').trim(),desc:v.get('d').trim(),cat:v.get('c'),price:Math.max(0,+v.get('p')||0),fmt:'—',size:'—',buys:0,tags:v.get('t').split(',').map(s=>s.trim()).filter(Boolean),on:1,g:'#7c3aed,#0ea5e9'});save();toast('Product saved');route()}
else if(f.id=='cf'){const ids=v.getAll('ids').map(Number);if(!ids.length)return toast('Choose at least one product','er');S.codes.unshift({code:gen(),ids,max:Math.max(1,+v.get('m')||1),uses:0,exp:v.get('e'),on:1});save();toast('Code generated');route()}});
$('#ownerBtn').onclick=e=>{owner=!owner;e.target.setAttribute('aria-pressed',owner);e.target.textContent='Owner mode: '+(owner?'on':'off');if(!owner&&location.hash=='#admin')location.hash='#home';route()};
addEventListener('hashchange',route);route();
</script>
</body>
</html>
